[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drm-screen"
version = "0.2.2"
description = "Layer-based screen manager for Raspberry Pi and embedded Linux: persistent layers, compositing or vector scenes, pointer input, output to DRM/KMS"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
# Split deliberately: setuptools maps a {name, email} pair to Author-email
# alone and leaves the legacy Author header unset, so anything reading
# Author (pypistats, some mirrors) reports "None".  Two entries fill both.
authors = [
    { name = "Carsten Bund" },
    { email = "carstenbund@gmail.com" },
]
dependencies = ["numpy", "drm-display"]
keywords = [
    "drm", "kms", "display", "framebuffer", "layers", "compositor",
    "raspberry-pi", "raspberrypi", "embedded", "sbc", "kiosk", "linux",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
assets = ["pillow"]

[project.urls]
Homepage = "https://github.com/carstenbund/drm_screen"
Repository = "https://github.com/carstenbund/drm_screen"

[tool.setuptools.packages.find]
where = ["."]
include = ["drm_screen*"]
